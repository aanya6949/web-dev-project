<!DOCTYPE html>
<html lang="en">
<head>

        body{

        .inline-block{
            display: inline-block;

            background-color: blue;
            box-sizing: border-box;
        }
        .course-container{
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;

<div class="course-container">

        <div class="courses"><p style="color: white;">Start Courses</p></div>
    </div>
    <div class="inline-block"><h3 style="color: blue;">CSS</h3>
        <p> Learn colors, fonts, borders, and beautiful webpage styling.</p>
        <div class="courses"><p style="color: white;">Start Courses</p></div>
    </div>
    <div class="inline-block"><h3 style="color: blue;">JavaScript</h3>
        <p> Learn JavaScript and make your webpages interactive.</p>

    </div>
    </div>
