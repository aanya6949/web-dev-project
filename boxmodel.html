<!DOCTYPE html>
<html>
    <head>
        <style>
            .block{
                display: block;
                width: 100px;
                padding: 20px;
                margin: 10px;
                border: 3px solid blue;
                border-radius: 10px;
                text-align: center;
                position: static;
            }
            .inline{
                display: inline;
                padding:20 px;
                margin: 15px;
                border: 3px solid red;
                border-radius: 15px;
            }
            .inline-block{
                display: inline-block;
                width: 100px;
                padding:20px ;
                margin: 10px;
                border: 5px solid rgb(118, 73, 18);
                border-radius: 10px;
                text-align: center;
                border-style: double;
            }
        </style>
    </head>
    <body>
        <h2>1.Block</h2>
        <div class="block">Box1</div>
        <div class="block">Box2</div>
        <div class="block">Box3</div>
        <h2>2.Inline</h2>
        <div class="inline">Box1</div>
        <div class="inline">Box2</div>
        <h2>3.Inline block</h2>
        <div class="inline-block">Box1</div>
        <div class="inline-block">Box2</div>
    </body>
</html>
