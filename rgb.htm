<!DOCTYPE html>
<html>
<head>
    <title>RGB Color</title>

    <style>
        h1 {
            color: rgb(255, 0, 0);
        }
        p {
            color: rgb(0, 0, 255);
        }
    </style>
</head>
<body>
    <h1>This is a heading in red color</h1>
    <p>This is a paragraph in blue color.</p>
</body>
</html>
